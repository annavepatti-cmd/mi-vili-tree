name: Build Kernel (Stock MIUI / HyperOS & Ports Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Toolchains & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev bzip2 libbz2-dev libssl-dev libelf-dev flex bison bc ccache zip unzip crossbuild-essential-arm64

      - name: Apply Techpack DSP GCC 10+ Compatibility Patches
        run: |
          sed -i 's/if (clkinfo_per_port\[idx\].clk_src_name == NULL)/if (\!clkinfo_per_port\[idx\].clk_src_name\[0\])/g' techpack/audio/dsp/q6afe.c || true
          sed -i 's/if (clk_src_name != NULL)/if (clk_src_name\[0\]\[0\])/g' techpack/audio/dsp/q6afe.c || true
          sed -i 's/if (clk_src_name\[CLK_SRC_FRACT\] != NULL)/if (clk_src_name\[CLK_SRC_FRACT\]\[0\])/g' techpack/audio/dsp/q6afe.c || true
          sed -i 's/\} else if (clk_src_name\[CLK_SRC_INTEGRAL\] != NULL)/\} else if (clk_src_name\[CLK_SRC_INTEGRAL\]\[0\])/g' techpack/audio/dsp/q6afe.c || true
          sed -i 's/.*case AFE_PORT_CMD_DEVICE_STOP:/\t\t\/* fallthrough *\/\n&/g' techpack/audio/dsp/q6afe.c || true
          sed -i 's/.*case ASM_MEDIA_FMT_APTX_AD_SPEECH:/\t\t\/* fallthrough *\/\n&/g' techpack/audio/dsp/q6afe.c || true
          sed -i 's/.*case ADM_PATH_NONLIVE_REC:/\t\t\/* fallthrough *\/\n&/g' techpack/audio/dsp/q6asm.c || true

      - name: Build Stock/Ports Kernel Image
        run: |
          make ARCH=arm64 vili_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Package AnyKernel3 (Stock MIUI/HyperOS & Ports Target)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp arch/arm64/boot/Image.gz-dtb AK3/Image.gz-dtb || cp arch/arm64/boot/Image.gz AK3/Image.gz
          cd AK3
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=RED Kernel [Stock MIUI / HyperOS & MIUI Ports Only]
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuntil=0
          device.name1=vili
          device.name2=vili_global
          device.name3=vili_in
          supported.versions=11 - 15
          supported.patchlevels=
          '; }
          block=auto;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          zip -r9 ../RED-vili-Stock-Ports-Kernel-$(date +%Y%m%d).zip * -x .git\* README.md *placeholder

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RED-vili-Stock-Ports-Kernel
          path: RED-vili-Stock-Ports-Kernel-*.zip
