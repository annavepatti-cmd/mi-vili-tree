name: Build Vili Kernel (MIUI / HyperOS & Ports)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev bzip2 libbz2-dev libssl-dev libelf-dev flex bison bc ccache zip unzip crossbuild-essential-arm64 device-tree-compiler

      - name: Checkout AOSP Clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: 'LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b'
          path: 'clang'

      - name: Checkout Kernel Source Tree
        uses: actions/checkout@v4
        with:
          repository: 'vili-develop/kernel_xiaomi_vili-RED'
          path: 'kernel_src'

      - name: Remove KernelSU & SuSFS Fully
        run: |
          cd kernel_src
          rm -rf drivers/kernelsu drivers/susfs fs/susfs
          find . -type f \( -name "Kconfig*" -o -name "Makefile*" \) -exec sed -i '/kernelsu/d' {} + || true
          find . -type f \( -name "Kconfig*" -o -name "Makefile*" \) -exec sed -i '/susfs/d' {} + || true
          find . -type f \( -name "Kconfig*" -o -name "Makefile*" \) -exec sed -i '/KSU/d' {} + || true
          find . -type f \( -name "Kconfig*" -o -name "Makefile*" \) -exec sed -i '/SUSFS/d' {} + || true
          find arch/arm64/configs/ -type f -exec sed -i '/CONFIG_KSU/d' {} + || true
          find arch/arm64/configs/ -type f -exec sed -i '/CONFIG_SUSFS/d' {} + || true

      - name: Apply Techpack Audio Patches and Compile
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel_src
          
          # Fix Techpack Audio DSP Fallthrough Errors
          find . -type f -name "q6afe.c" -exec sed -i 's/if (clkinfo_per_port\[idx\].clk_src_name == NULL)/if (\!clkinfo_per_port\[idx\].clk_src_name\[0\])/g' {} + || true
          find . -type f -name "q6afe.c" -exec sed -i 's/.*case AFE_PORT_CMD_DEVICE_STOP:/\t\t\/* fallthrough *\/\n&/g' {} + || true
          find . -type f -name "q6asm.c" -exec sed -i 's/.*case ADM_PATH_NONLIVE_REC:/\t\t\/* fallthrough *\/\n&/g' {} + || true

          # Target exact defconfig file
          if [ -f "arch/arm64/configs/vendor/vili_defconfig" ]; then
            DEFCONFIG_NAME="vendor/vili_defconfig"
          elif [ -f "arch/arm64/configs/vili_defconfig" ]; then
            DEFCONFIG_NAME="vili_defconfig"
          else
            DEFCONFIG_NAME="vendor/sm8350_defconfig"
          fi

          echo "Building Stock/MIUI Kernel with Defconfig: $DEFCONFIG_NAME"

          # Generate Configuration
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ $DEFCONFIG_NAME
          
          # Disable WERROR so warnings don't trigger Error 2
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/g' out/.config || true
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config

          # Compile with explicit LLVM toolchain flags
          make -j$(nproc) O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          IMAGE_PATH=$(find kernel_src/ -type f \( -name "Image.gz-dtb" -o -name "Image.gz" \) | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "ERROR: Compiled Kernel Image not found!"
            exit 1
          fi
          
          cp "$IMAGE_PATH" AK3/Image.gz-dtb || cp "$IMAGE_PATH" AK3/Image.gz
          
          cd AK3
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=RED Kernel [Stock MIUI / HyperOS & MIUI Ports Only]
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuntil=0
          device.name1=vili
          device.name2=vili_global
          device.name3=vili_in
          supported.versions=11 - 15
          supported.patchlevels=
          '; }
          block=auto;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          zip -r9 ../RED-vili-Stock-Ports-Kernel-$(date +%Y%m%d).zip * -x .git\* README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vili-kernel
          path: RED-vili-Stock-Ports-Kernel-*.zip
