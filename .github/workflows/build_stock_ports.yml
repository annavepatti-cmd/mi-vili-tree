name: Build Vili Kernel (MIUI / HyperOS & Ports)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev bzip2 libbz2-dev libssl-dev libelf-dev flex bison bc ccache zip unzip

      - name: Setup Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

      - name: Apply Techpack Audio Patches
        run: |
          find . -type f -name "q6afe.c" -exec sed -i 's/if (clkinfo_per_port\[idx\].clk_src_name == NULL)/if (\!clkinfo_per_port\[idx\].clk_src_name\[0\])/g' {} + || true
          find . -type f -name "q6afe.c" -exec sed -i 's/.*case AFE_PORT_CMD_DEVICE_STOP:/\t\t\/* fallthrough *\/\n&/g' {} + || true
          find . -type f -name "q6asm.c" -exec sed -i 's/.*case ADM_PATH_NONLIVE_REC:/\t\t\/* fallthrough *\/\n&/g' {} + || true

      - name: Build Kernel Image
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          
          # Find relative defconfig path under arch/arm64/configs/
          DEFCONFIG=$(find arch/arm64/configs -type f \( -name "*vili*" -o -name "*sm8350*" \) | sed 's|arch/arm64/configs/||' | head -n 1)
          
          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: Could not locate defconfig in arch/arm64/configs/"
            exit 1
          fi
          
          echo "Selected Defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          IMAGE_PATH=$(find out/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          cp $IMAGE_PATH AK3/Image.gz-dtb || cp $IMAGE_PATH AK3/Image.gz
          
          cd AK3
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=RED Kernel [Stock MIUI / HyperOS & MIUI Ports Only]
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuntil=0
          device.name1=vili
          device.name2=vili_global
          device.name3=vili_in
          supported.versions=11 - 15
          supported.patchlevels=
          '; }
          block=auto;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          zip -r9 ../RED-vili-Stock-Ports-Kernel-$(date +%Y%m%d).zip * -x .git\* README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vili-kernel
          path: RED-vili-Stock-Ports-Kernel-*.zip
